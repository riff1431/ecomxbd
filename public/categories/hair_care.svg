<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="hairBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#hairBg)" rx="30"/>
  <circle cx="150" cy="150" r="100" fill="#10b981" opacity="0.15"/>
  
  <!-- Shampoo Bottle with Pump -->
  <g transform="translate(80, 50)">
    <rect x="25" y="80" width="70" height="135" rx="16" fill="#059669"/>
    <rect x="35" y="105" width="50" height="85" fill="#ffffff" opacity="0.9" rx="6"/>
    <text x="60" y="145" font-family="sans-serif" font-size="10" font-weight="900" fill="#065f46" text-anchor="middle">HERBAL</text>
    <text x="60" y="160" font-family="sans-serif" font-size="8" font-weight="700" fill="#10b981" text-anchor="middle">SHAMPOO</text>
    <!-- Pump Dispenser -->
    <rect x="52" y="55" width="16" height="25" fill="#064e3b"/>
    <path d="M40,55 L80,55 L80,45 L50,45 L35,50 Z" fill="#047857"/>
  </g>
  
  <!-- Botanical Leaves -->
  <g transform="translate(175, 100)">
    <ellipse cx="20" cy="30" rx="14" ry="30" fill="#10b981" transform="rotate(35, 20, 30)"/>
    <ellipse cx="45" cy="65" rx="12" ry="25" fill="#34d399" transform="rotate(-20, 45, 65)"/>
  </g>
</svg>
