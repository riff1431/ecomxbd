<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#skinBg)" rx="30"/>
  <circle cx="150" cy="150" r="100" fill="#0284c7" opacity="0.15"/>
  
  <!-- Moisturizer Cream Jar -->
  <g transform="translate(60, 100)">
    <rect x="0" y="40" width="100" height="65" rx="14" fill="#ffffff" stroke="#38bdf8" stroke-width="4"/>
    <rect x="10" y="55" width="80" height="35" rx="6" fill="#e0f2fe"/>
    <text x="50" y="77" font-family="sans-serif" font-size="9" font-weight="900" fill="#0284c7" text-anchor="middle">HYDRA GEL</text>
    <rect x="-5" y="20" width="110" height="22" rx="8" fill="#0284c7"/>
  </g>
  
  <!-- Vitamin C Dropper -->
  <g transform="translate(175, 60)">
    <rect x="20" y="60" width="50" height="120" rx="12" fill="#fb923c"/>
    <rect x="30" y="35" width="30" height="25" fill="#1e293b"/>
    <ellipse cx="45" cy="25" rx="18" ry="12" fill="#f8fafc"/>
    <rect x="26" y="80" width="38" height="60" fill="#ffffff" rx="4"/>
    <text x="45" y="110" font-family="sans-serif" font-size="8" font-weight="900" fill="#ea580c" text-anchor="middle">VIT-C</text>
  </g>
</svg>
