<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="kbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#kbg)" rx="30"/>
  <circle cx="150" cy="150" r="100" fill="#3b82f6" opacity="0.12"/>
  
  <!-- Sheet Mask Pouch -->
  <g transform="translate(60, 80) rotate(-10)">
    <rect x="0" y="0" width="100" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="15" y="20" width="70" height="8" rx="4" fill="#3b82f6"/>
    <circle cx="50" cy="70" r="24" fill="#dbeafe"/>
    <text x="50" y="75" font-family="sans-serif" font-size="12" font-weight="900" fill="#2563eb" text-anchor="middle">K-MASK</text>
  </g>
  
  <!-- Snail Ampoule Dropper Bottle -->
  <g transform="translate(150, 60)">
    <rect x="20" y="60" width="60" height="120" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="4"/>
    <rect x="35" y="30" width="30" height="30" fill="#1e293b"/>
    <ellipse cx="50" cy="20" rx="20" ry="14" fill="#f8fafc"/>
    <rect x="30" y="85" width="40" height="65" fill="#e0f2fe" rx="4"/>
    <text x="50" y="115" font-family="sans-serif" font-size="8" font-weight="900" fill="#1e40af" text-anchor="middle">SNAIL</text>
    <text x="50" y="128" font-family="sans-serif" font-size="7" font-weight="700" fill="#60a5fa" text-anchor="middle">96%</text>
  </g>
</svg>
