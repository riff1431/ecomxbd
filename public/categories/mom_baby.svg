<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="babyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#babyBg)" rx="30"/>
  <circle cx="150" cy="150" r="100" fill="#facc15" opacity="0.2"/>
  
  <!-- Baby Lotion Bottle -->
  <g transform="translate(60, 60)">
    <rect x="20" y="70" width="70" height="130" rx="20" fill="#f59e0b"/>
    <rect x="30" y="95" width="50" height="80" fill="#ffffff" rx="8"/>
    <text x="55" y="135" font-family="sans-serif" font-size="10" font-weight="900" fill="#b45309" text-anchor="middle">BABY</text>
    <text x="55" y="150" font-family="sans-serif" font-size="8" font-weight="700" fill="#f59e0b" text-anchor="middle">LOTION</text>
    <rect x="45" y="50" width="20" height="20" rx="6" fill="#78350f"/>
  </g>
  
  <!-- Cute Teddy Bear Face -->
  <g transform="translate(170, 100)">
    <!-- Ears -->
    <circle cx="20" cy="20" r="12" fill="#d97706"/>
    <circle cx="20" cy="20" r="6" fill="#fef3c7"/>
    <circle cx="70" cy="20" r="12" fill="#d97706"/>
    <circle cx="70" cy="20" r="6" fill="#fef3c7"/>
    <!-- Head -->
    <circle cx="45" cy="45" r="32" fill="#d97706"/>
    <!-- Eyes -->
    <circle cx="35" cy="40" r="4" fill="#1e293b"/>
    <circle cx="55" cy="40" r="4" fill="#1e293b"/>
    <!-- Snout -->
    <ellipse cx="45" cy="55" rx="14" ry="10" fill="#fef3c7"/>
    <ellipse cx="45" cy="52" rx="6" ry="4" fill="#1e293b"/>
  </g>
</svg>
