<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="makeupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#makeupBg)" rx="30"/>
  <circle cx="150" cy="150" r="100" fill="#f472b6" opacity="0.15"/>
  
  <!-- Makeup Brush -->
  <g transform="translate(70, 70) rotate(-25)">
    <rect x="0" y="70" width="16" height="110" rx="8" fill="#1f2937"/>
    <rect x="0" y="45" width="16" height="25" rx="3" fill="#fbbf24"/>
    <path d="M-4,45 C-4,10 20,10 20,45 Z" fill="#ec4899"/>
  </g>
  
  <!-- Lipstick -->
  <g transform="translate(160, 90)">
    <!-- Base -->
    <rect x="20" y="80" width="40" height="80" rx="6" fill="#111827"/>
    <rect x="25" y="45" width="30" height="35" fill="#fbbf24"/>
    <!-- Bullet Red Tip -->
    <path d="M25,45 L25,20 L45,5 L55,20 L55,45 Z" fill="#e11d48"/>
  </g>
  
  <!-- Blush Compact -->
  <g transform="translate(80, 170)">
    <circle cx="45" cy="45" r="38" fill="#fb7185" stroke="#be185d" stroke-width="4"/>
    <circle cx="45" cy="45" r="28" fill="#fda4af"/>
    <circle cx="45" cy="45" r="18" fill="#f43f5e"/>
  </g>
</svg>
