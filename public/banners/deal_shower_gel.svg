<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" fill="url(#peachGrad)" rx="24"/>
  <circle cx="400" cy="120" r="180" fill="#fb923c" opacity="0.12"/>
  <circle cx="100" cy="420" r="140" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Header Logos -->
  <text x="40" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#9a3412" letter-spacing="1">Meril</text>
  <text x="460" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#9a3412" opacity="0.6" text-anchor="end" letter-spacing="3">SHAJGOJ</text>
  
  <!-- Main Titles -->
  <text x="40" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#1f2937">Perfumed</text>
  <text x="40" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#1f2937">Shower Gel</text>
  
  <!-- Big 51 TK OFF Badge -->
  <text x="40" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ea580c" letter-spacing="-1">51 TK OFF</text>
  <text x="40" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#78350f">Experience Luxury Now</text>
  
  <!-- Product Artwork on Right -->
  <g transform="translate(280, 130)">
    <!-- Bottle Body -->
    <rect x="50" y="80" width="100" height="210" rx="40" fill="#f97316" opacity="0.85"/>
    <rect x="55" y="85" width="90" height="200" rx="35" fill="#ea580c"/>
    <rect x="65" y="120" width="70" height="120" rx="12" fill="#fff" opacity="0.95"/>
    <text x="100" y="155" font-family="sans-serif" font-size="12" font-weight="900" fill="#ea580c" text-anchor="middle">Meril</text>
    <text x="100" y="175" font-family="sans-serif" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle">BLISS</text>
    <text x="100" y="195" font-family="sans-serif" font-size="9" font-weight="600" fill="#6b7280" text-anchor="middle">Shower Gel</text>
    <!-- Cap -->
    <rect x="80" y="55" width="40" height="25" rx="6" fill="#7c2d12"/>
    <circle cx="100" cy="50" r="12" fill="#9a3412"/>
    <!-- Floating Petals -->
    <ellipse cx="20" cy="180" rx="16" ry="24" fill="#fb7185" opacity="0.7" transform="rotate(-25, 20, 180)"/>
    <ellipse cx="160" cy="240" rx="14" ry="20" fill="#f43f5e" opacity="0.6" transform="rotate(35, 160, 240)"/>
    <ellipse cx="40" cy="270" rx="10" ry="15" fill="#fbbf24" opacity="0.8"/>
  </g>
  
  <!-- Bottom Action Pill -->
  <rect x="40" y="405" width="130" height="42" rx="10" fill="#111827"/>
  <text x="105" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SHOP NOW</text>
</svg>
