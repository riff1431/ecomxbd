<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="ordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="350" fill="url(#ordGrad)" rx="20"/>
  
  <text x="60" y="70" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="-0.5">The Ordinary.</text>
  <text x="60" y="140" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">33% OFF</text>
  <text x="60" y="180" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">Direct Canadian Clinical Imports</text>
  
  <!-- Dropper Bottles on Right -->
  <g transform="translate(530, 45)">
    <!-- Bottle 1 (AHA/BHA Red) -->
    <g transform="translate(0, 40)">
      <rect x="0" y="40" width="55" height="130" rx="8" fill="#991b1b"/>
      <rect x="18" y="20" width="18" height="20" fill="#0f172a"/>
      <ellipse cx="27" cy="15" rx="14" ry="10" fill="#f8fafc"/>
    </g>
    <!-- Bottle 2 (Niacinamide Clear) -->
    <g transform="translate(75, 10)">
      <rect x="0" y="40" width="60" height="150" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="5" y="60" width="50" height="70" fill="#ffffff"/>
      <text x="30" y="90" font-family="sans-serif" font-size="7" font-weight="900" fill="#0f172a" text-anchor="middle">The Ordinary.</text>
      <text x="30" y="105" font-family="sans-serif" font-size="6" font-weight="600" fill="#475569" text-anchor="middle">Niacinamide 10%</text>
      <rect x="20" y="20" width="20" height="20" fill="#0f172a"/>
      <ellipse cx="30" cy="15" rx="15" ry="10" fill="#f8fafc"/>
    </g>
    <!-- Bottle 3 (Hyaluronic Acid) -->
    <g transform="translate(155, 30)">
      <rect x="0" y="40" width="55" height="140" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="18" y="20" width="18" height="20" fill="#0f172a"/>
      <ellipse cx="27" cy="15" rx="14" ry="10" fill="#f8fafc"/>
    </g>
  </g>
</svg>
