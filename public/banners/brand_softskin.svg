<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="softSkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="350" fill="url(#softSkinGrad)" rx="20"/>
  
  <text x="60" y="110" font-family="Brush Script MT, 'Segoe Script', cursive, serif" font-size="64" font-weight="bold" fill="#ffffff" letter-spacing="1">Soft skin</text>
  <text x="60" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#1e293b" letter-spacing="-0.5">Luxury Daily Body Care</text>
  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Deep Hydration &amp; Floral Radiance</text>
  
  <!-- Bottles on Right -->
  <g transform="translate(540, 50)">
    <!-- Pink Lotion Bottle -->
    <rect x="0" y="40" width="75" height="190" rx="24" fill="#f43f5e"/>
    <rect x="25" y="10" width="25" height="30" fill="#1e293b"/>
    <rect x="15" y="0" width="45" height="12" rx="4" fill="#0f172a"/>
    
    <!-- Lemon Body Wash Bottle -->
    <rect x="95" y="20" width="80" height="210" rx="26" fill="#fef08a"/>
    <rect x="122" y="-10" width="26" height="30" fill="#1e293b"/>
    <rect x="112" y="-20" width="46" height="12" rx="4" fill="#0f172a"/>
  </g>
</svg>
