<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="pondsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="40%" stop-color="#fce7f3"/>
      <stop offset="80%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="wavePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" fill="url(#pondsGrad)" rx="20"/>
  <path d="M0,120 Q300,180 600,90 T1200,60 L1200,180 L0,180 Z" fill="url(#wavePink)"/>
  
  <!-- Left Product Jars -->
  <g transform="translate(180, 25)">
    <circle cx="65" cy="65" r="60" fill="#fff" opacity="0.95" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.08))"/>
    <ellipse cx="65" cy="65" rx="42" ry="42" fill="#38bdf8"/>
    <text x="65" y="60" font-family="serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">POND'S</text>
    <text x="65" y="76" font-family="sans-serif" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">HYDRA MIRACLE</text>
    <text x="65" y="88" font-family="sans-serif" font-size="7" font-weight="600" fill="#e0f2fe" text-anchor="middle">Super Light Gel</text>
  </g>
  
  <!-- Center Main Brand Text -->
  <text x="440" y="85" font-family="Georgia, serif" font-size="44" font-weight="900" fill="#be185d" letter-spacing="2">POND'S</text>
  <text x="440" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#be185d" letter-spacing="6">MIRACLE ME</text>
  
  <!-- Right Badge -->
  <rect x="850" y="55" width="280" height="70" rx="14" fill="#e91e63" filter="drop-shadow(0 4px 12px rgba(233,30,99,0.3))"/>
  <text x="990" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">UP TO 25% OFF</text>
</svg>
