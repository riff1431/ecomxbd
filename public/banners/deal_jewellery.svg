<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" fill="url(#purpleGrad)" rx="24"/>
  <circle cx="380" cy="150" r="160" fill="#a855f7" opacity="0.12"/>
  <circle cx="80" cy="400" r="120" fill="#c084fc" opacity="0.15"/>
  
  <!-- Header Logos -->
  <text x="40" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#7e22ce" letter-spacing="1">S</text>
  <text x="460" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#7e22ce" opacity="0.6" text-anchor="end" letter-spacing="3">SHAJGOJ</text>
  
  <!-- Main Titles -->
  <text x="40" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#1f2937">JEWELLERY &amp;</text>
  <text x="40" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#1f2937">ACCESSORIES</text>
  
  <!-- Badge -->
  <text x="40" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#9333ea" letter-spacing="1">NEW IN</text>
  <text x="40" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#6b21a8">SHAJGOJ NEW ARRIVALS</text>
  
  <!-- Jewellery Artwork on Right -->
  <g transform="translate(290, 140)">
    <!-- Gold/Emerald Necklace -->
    <path d="M20,60 Q90,190 160,60" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="90" cy="155" r="14" fill="#10b981" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="60" cy="135" r="10" fill="#3b82f6" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="120" cy="135" r="10" fill="#ec4899" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="35" cy="100" r="8" fill="#10b981" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="145" cy="100" r="8" fill="#10b981" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Earrings -->
    <g transform="translate(10, 190)">
      <circle cx="20" cy="20" r="6" fill="#fbbf24"/>
      <path d="M20,26 L20,60" stroke="#fbbf24" stroke-width="3"/>
      <polygon points="20,55 8,75 32,75" fill="#3b82f6" stroke="#fbbf24" stroke-width="2"/>
    </g>
    <g transform="translate(110, 190)">
      <circle cx="20" cy="20" r="6" fill="#fbbf24"/>
      <path d="M20,26 L20,60" stroke="#fbbf24" stroke-width="3"/>
      <polygon points="20,55 8,75 32,75" fill="#ec4899" stroke="#fbbf24" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Bottom Action Pill -->
  <rect x="40" y="405" width="130" height="42" rx="10" fill="#111827"/>
  <text x="105" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SHOP NOW</text>
</svg>
